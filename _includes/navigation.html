<nav class='navigation'>
            <div class='container'>
                {%- if page.url != '/' %}
                <a class='home' href='/'><b>Fritz&nbsp;Ali</b>&nbsp;Agildere</a>
                {%- endif %}
                <a class='home-short' href='/'{% if page.url == '/' %} aria-current='page'{% endif %}>Home</a>
                {%- assign current_url = page.url | split: '/' %}
                {%- for item in site.data.navigation %}
                {%- assign navigation_url = item.url | split: '/' %}
                <a href='{{ item.url | relative_url }}'{% if current_url[1] == navigation_url[1] %} aria-current='page'{% endif %}>{{ item.title }}</a>
                {%- endfor %}
            </div>
        </nav>
        <div class='scrollbar'></div>
